name: JIRA Lint

on:
  pull_request:
    types: [opened, synchronize, edited]

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  find_ticket_in_title:
    name: Jira Lint
    runs-on: ubuntu-22.04
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Find and validate JIRA ticket in PR title
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          ISSUE_KEY=$(echo "$PR_TITLE" | grep -oE '[A-Z]+-[0-9]+' | head -1)
          
          if [ -z "$ISSUE_KEY" ]; then
            echo "❌ PR title must contain a JIRA ticket code"
            exit 1
          fi
          
          # Verify ticket exists (using token as Bearer auth)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $JIRA_API_TOKEN" \
            "https://invisible.atlassian.net/rest/api/3/issue/$ISSUE_KEY")
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ JIRA ticket $ISSUE_KEY does not exist (HTTP $HTTP_CODE)"
            exit 1
          fi
          
          echo "✅ Valid JIRA ticket: $ISSUE_KEY"